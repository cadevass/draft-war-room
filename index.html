<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Draft War Room</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --faint: #444;
    --t1: #f5a97f;
    --t2: #7ab8f5;
    --t3: #8fcf6a;
    --t4: #f5c842;
    --t5: #888;
    --green: #8fcf6a;
    --red: #e05555;
    --yellow: #f5c842;
    --font: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }
  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .3px; flex: 1; min-width: 140px; }
  .draft-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .pick-tracker { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .pick-tracker .pt-item { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .pick-tracker .pt-num { font-size: 14px; font-weight: 600; color: var(--text); }
  .pick-tracker .pt-next { color: var(--yellow); font-weight: 600; }
  .pick-tracker input[type=number] { width: 50px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .pt-divider { width: 1px; height: 16px; background: var(--border); }

  .scarcity-bar { display: flex; gap: 10px; padding: 8px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .scarcity-chip { font-size: 11px; padding: 4px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .scarcity-chip.low { color: var(--red); border-color: rgba(224,85,85,.3); background: rgba(224,85,85,.08); }
  .scarcity-chip.med { color: var(--yellow); border-color: rgba(245,200,66,.3); background: rgba(245,200,66,.08); }

  .suggestion-box { padding: 14px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(143,207,106,.04), transparent); }
  .suggestion-box h3 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .suggestion-list { display: flex; flex-direction: column; gap: 6px; }
  .suggestion-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .suggestion-rank { font-size: 11px; color: var(--muted); width: 16px; }
  .suggestion-name { font-size: 13px; font-weight: 500; flex: 1; }
  .suggestion-reason { font-size: 11px; color: var(--muted); }
  .suggestion-pos-tag { font-size: 10px; padding: 2px 7px; border-radius: 8px; font-weight: 600; }
  .suggestion-pos-tag.RB { background: rgba(245,169,127,.15); color: var(--t1); }
  .suggestion-pos-tag.WR { background: rgba(122,184,245,.15); color: var(--t2); }
  .suggestion-pos-tag.TE { background: rgba(143,207,106,.15); color: var(--t3); }
  .suggestion-pos-tag.QB { background: rgba(245,200,66,.15); color: var(--t4); }
  .no-suggestion { font-size: 12px; color: var(--faint); }

  .roster-section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .roster-section h3 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .roster-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .roster-slot { font-size: 11px; padding: 5px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .roster-slot.filled { color: var(--text); border-color: var(--faint); }
  .roster-need { color: var(--yellow); }
  .roster-empty { font-size: 12px; color: var(--faint); padding: 4px 0; }

  .toolbar { display: flex; gap: 8px; padding: 12px 20px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
  .toolbar input, .toolbar select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 13px; outline: none; }
  .toolbar input { flex: 1; min-width: 140px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--faint); }
  .toolbar select option { background: var(--surface); }
  .btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
  .btn:hover { color: var(--text); border-color: var(--faint); }
  .pos-tabs { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--border); }
  .pos-tab { padding: 10px 18px; font-size: 13px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; transition: color .15s; }
  .pos-tab.active { color: var(--text); border-bottom-color: var(--text); }
  .pos-tab:hover { color: var(--text); }
  .legend { display: flex; gap: 16px; padding: 8px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; }
  thead { position: sticky; top: 0; background: var(--bg); z-index: 5; }
  th { font-size: 11px; font-weight: 500; color: var(--muted); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); letter-spacing: .4px; text-transform: uppercase; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.player-row:hover td { background: var(--surface); }
  tr.drafted td { opacity: 0.35; }
  tr.drafted-me td { opacity: 1; background: rgba(143,207,106,.06); }
  tr.tier-divider td { background: var(--surface); font-size: 10px; font-weight: 600; color: var(--muted); padding: 4px 12px; letter-spacing: 1px; text-transform: uppercase; }
  .name-cell { display: flex; align-items: center; gap: 8px; }
  .rank { color: var(--muted); font-size: 12px; min-width: 22px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; font-weight: 500; }
  .tag.target { background: rgba(245,200,66,.15); color: var(--yellow); border: 1px solid rgba(245,200,66,.25); }
  .tag.flagged { background: rgba(224,85,85,.15); color: var(--red); border: 1px solid rgba(224,85,85,.25); }
  .tag.up { background: rgba(143,207,106,.15); color: var(--green); border: 1px solid rgba(143,207,106,.25); }
  .tag.down { background: rgba(224,85,85,.15); color: var(--red); border: 1px solid rgba(224,85,85,.25); }
  .tag.gone { background: rgba(136,136,136,.1); color: var(--muted); border: 1px solid var(--border); }
  .tag.mine { background: rgba(143,207,106,.18); color: var(--green); border: 1px solid rgba(143,207,106,.3); }
  .team { font-size: 11px; color: var(--muted); }
  .tier-num { font-size: 12px; color: var(--muted); }
  .notes-input { background: transparent; border: none; border-bottom: 1px solid transparent; color: var(--text); font-size: 12px; width: 100%; outline: none; padding: 2px 0; transition: border-color .15s; }
  .notes-input:focus { border-bottom-color: var(--faint); }
  .notes-input::placeholder { color: var(--faint); }
  input[type=checkbox] { accent-color: var(--green); width: 14px; height: 14px; cursor: pointer; }
  .draft-actions { display: flex; gap: 4px; }
  .draft-actions button { font-size: 10px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
  .draft-actions button.me { color: var(--green); }
  .draft-actions button.other { color: var(--red); }
  .draft-actions button:hover { border-color: var(--faint); }
  .draft-actions button.active-me { background: rgba(143,207,106,.15); border-color: rgba(143,207,106,.3); color: var(--green); }
  .draft-actions button.active-other { background: rgba(224,85,85,.15); border-color: rgba(224,85,85,.3); color: var(--red); }

  .update-section { padding: 20px; border-top: 1px solid var(--border); }
  .update-section h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
  .update-input-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .update-input-row input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 14px; font-size: 13px; outline: none; }
  .update-input-row input:focus { border-color: var(--faint); }
  .add-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 18px; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; transition: border-color .15s; }
  .add-btn:hover { border-color: var(--faint); }
  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .feed-item.positive { border-left: 3px solid var(--green); }
  .feed-item.negative { border-left: 3px solid var(--red); }
  .feed-item.neutral { border-left: 3px solid var(--faint); }
  .feed-top { display: flex; gap: 10px; align-items: flex-start; }
  .feed-ts { font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 1px; }
  .feed-text { flex: 1; line-height: 1.5; font-size: 13px; }
  .feed-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .feed-override { font-size: 13px; cursor: pointer; padding: 1px 4px; border-radius: 4px; border: none; background: transparent; color: var(--faint); transition: color .15s; line-height: 1; }
  .feed-override:hover { color: var(--text); }
  .feed-override.active-pos { color: var(--green); }
  .feed-override.active-neg { color: var(--red); }
  .feed-del { color: var(--faint); cursor: pointer; font-size: 12px; padding: 0 2px; }
  .feed-del:hover { color: var(--red); }
  .feed-analysis { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.6; }
  .move-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 8px; margin: 2px 3px 2px 0; font-weight: 500; }
  .move-tag.up { background: rgba(143,207,106,.15); color: var(--green); }
  .move-tag.down { background: rgba(224,85,85,.15); color: var(--red); }
  .move-tag.watch { background: rgba(245,200,66,.15); color: var(--yellow); }
  .analysing { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 8px; }
  .no-feed { font-size: 13px; color: var(--faint); padding: 8px 0; }
  @media (max-width: 600px) {
    .toolbar { padding: 10px 12px; }
    td, th { padding: 7px 8px; }
    header { padding: 12px 14px; }
    .pos-tab { padding: 10px 12px; font-size: 12px; }
  }

</head>
<body>

<header>
  <h1>2026 Draft War Room</h1>
  <span class="draft-badge">PPR</span>
</header>

<div class="pick-tracker">
  <div class="pt-item">Teams: <input type="number" id="numTeams" value="10" min="4" max="20" onchange="updatePickSettings()"></div>
  <div class="pt-item">My slot: <input type="number" id="mySlot" value="8" min="1" max="20" onchange="updatePickSettings()"></div>
  <div class="pt-divider"></div>
  <div class="pt-item">Overall pick: <span class="pt-num" id="overallPick">1</span></div>
  <div class="pt-item">Round: <span class="pt-num" id="curRound">1</span></div>
  <div class="pt-divider"></div>
  <div class="pt-item pt-next" id="nextPickInfo">Your pick now</div>
</div>

<div class="scarcity-bar" id="scarcityBar"></div>

<div class="suggestion-box">
  <h3>Best available right now</h3>
  <div class="suggestion-list" id="suggestionList"></div>
</div>

<div class="roster-section">
  <h3>My roster <span id="rosterCount" style="color:var(--muted);font-weight:400;"></span></h3>
  <div class="roster-grid" id="rosterGrid"></div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search player or team…" oninput="render()">
  <select id="tierFilter" onchange="render()">
    <option value="">All tiers</option>
    <option value="1">Tier 1</option>
    <option value="2">Tier 2</option>
    <option value="3">Tier 3</option>
    <option value="4">Tier 4</option>
    <option value="5">Tier 5</option>
    <option value="6">Tier 6</option>
  </select>
  <select id="flagFilter" onchange="render()">
    <option value="">All players</option>
    <option value="box">Targets only</option>
    <option value="inj">Flagged only</option>
    <option value="avail">Hide drafted</option>
  </select>
  <button class="btn" onclick="clearDrafted()">Clear drafted</button>
  <button class="btn" onclick="openAddPlayer()">+ Add player</button>
</div>

<div id="addPlayerModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#1a1a1a;border:1px solid #2e2e2e;border-radius:12px;padding:24px;width:320px;display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:14px;font-weight:600;color:#f0f0f0;">Add player</div>
    <input id="ap_name" placeholder="Name" style="background:#222;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;">
    <input id="ap_team" placeholder="Team (e.g. CLE)" style="background:#222;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;">
    <select id="ap_pos" style="background:#222;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;">
      <option value="WR">WR</option><option value="RB">RB</option><option value="TE">TE</option><option value="QB">QB</option>
    </select>
    <input id="ap_tier" placeholder="Tier (1-5)" type="number" min="1" max="5" style="background:#222;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;">
    <input id="ap_rank" placeholder="Rank (e.g. 41)" type="number" style="background:#222;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;">
    <div style="display:flex;gap:8px;">
      <button onclick="confirmAddPlayer()" style="flex:1;background:#222;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:8px;padding:9px;font-size:13px;cursor:pointer;font-weight:500;">Add</button>
      <button onclick="closeAddPlayer()" style="flex:1;background:transparent;border:1px solid #2e2e2e;color:#888;border-radius:8px;padding:9px;font-size:13px;cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<div class="pos-tabs">
  <button class="pos-tab active" onclick="setPos('RB',this)">RB</button>
  <button class="pos-tab" onclick="setPos('WR',this)">WR</button>
  <button class="pos-tab" onclick="setPos('TE',this)">TE</button>
  <button class="pos-tab" onclick="setPos('QB',this)">QB</button>
</div>

<div class="legend">
  <div class="leg"><span class="dot" style="background:var(--t1)"></span>Tier 1</div>
  <div class="leg"><span class="dot" style="background:var(--t2)"></span>Tier 2</div>
  <div class="leg"><span class="dot" style="background:var(--t3)"></span>Tier 3</div>
  <div class="leg"><span class="dot" style="background:var(--t4)"></span>Tier 4</div>
  <div class="leg"><span class="dot" style="background:var(--t5)"></span>Tier 5</div>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Player</th>
      <th>Team</th>
      <th>Tier</th>
      <th>Notes</th>
      <th>Draft</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="update-section">
  <h3>News & Updates</h3>
  <div class="update-input-row">
    <input type="text" id="updateInput" placeholder="Paste tweet or note — AI adjusts rankings automatically…" onkeydown="if(event.key==='Enter')addUpdate()">
    <button class="add-btn" onclick="addUpdate()">Add ↗</button>
  </div>
  <div class="feed" id="feed"><div class="no-feed">No updates yet.</div></div>
</div>

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

  Object.entries(savedCustom).forEach(([pos, players]) => {
    DATA[pos].push(...players);
  });
} 

let curPos        = 'RB';
let drafted       = load('drafted', {});       // key -> 'me' | 'other'
let notes         = load('notes', {});
let rankOverrides = load('rankOverrides', {});
let tierOverrides = load('tierOverrides', {});
let injOverrides  = load('injOverrides', {});
let updates       = load('updates', []);
let numTeams      = load('numTeams', 10);
let mySlot        = load('mySlot', 8);

document.getElementById('mySlot').value = mySlot;

function setPos(p, el) {
  curPos = p;
  document.querySelectorAll('.pos-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getPlayers(pos) {
  return DATA[pos].map(p => {
    const key = pos + p.r;
    return {
      ...p,
      tier: tierOverrides[key] !== undefined ? tierOverrides[key] : p.tier,
      inj:  injOverrides[key]  !== undefined ? injOverrides[key]  : p.inj,
    };
  }).sort((a, b) => (a.r + (rankOverrides[pos + a.r] || 0)) - (b.r + (rankOverrides[pos + b.r] || 0)));
}

function getAllPlayersFlat() {
  return Object.entries(DATA).flatMap(([pos, players]) =>
    getPlayers(pos).map(p => ({...p, pos, key: pos + p.r}))
  );
}

// ---------- Draft / Pick tracking ----------

function totalDraftedCount() {
  return Object.keys(drafted).length;
}

function updatePickSettings() {
  numTeams = parseInt(document.getElementById('numTeams').value) || 10;
  mySlot = parseInt(document.getElementById('mySlot').value) || 1;
  save('numTeams', numTeams);
  save('mySlot', mySlot);
  renderPickTracker();
}

function getMyPickNumbers(maxPick) {
  // Snake draft: round 1 = mySlot, round 2 = (numTeams - mySlot + 1), etc.
  const picks = [];
  let round = 1;
  while (picks.length === 0 || picks[picks.length-1] <= maxPick) {
    const base = (round - 1) * numTeams;
    const pickInRound = (round % 2 === 1) ? mySlot : (numTeams - mySlot + 1);
    const overall = base + pickInRound;
    picks.push(overall);
    round++;
    if (round > 30) break;
  }
  return picks;
}

function renderPickTracker() {
  const overallPick = totalDraftedCount() + 1;
  const round = Math.floor((overallPick - 1) / numTeams) + 1;
  document.getElementById('overallPick').textContent = overallPick;
  document.getElementById('curRound').textContent = round;

  const myPicks = getMyPickNumbers(overallPick + numTeams * 2);
  const nextMyPick = myPicks.find(p => p >= overallPick);
  const picksAway = nextMyPick - overallPick;

  const info = document.getElementById('nextPickInfo');
  if (picksAway === 0) {
    info.textContent = "Your pick now";
  } else {
    info.textContent = `Your pick in ${picksAway} pick${picksAway === 1 ? '' : 's'}`;
  }
}

// ---------- Scarcity ----------

function renderScarcity() {
  const bar = document.getElementById('scarcityBar');
  bar.innerHTML = '';
  ['RB','WR','TE','QB'].forEach(pos => {
    const players = getPlayers(pos);
    [1,2,3].forEach(tierNum => {
      const remaining = players.filter(p => p.tier === tierNum && drafted[pos + p.r] === undefined).length;
      const totalInTier = players.filter(p => p.tier === tierNum).length;
      if (totalInTier === 0) return;
      let cls = '';
      if (remaining <= 1) cls = 'low';
      else if (remaining <= 3) cls = 'med';
      if (remaining <= 3) {
        const chip = document.createElement('div');
        chip.className = `scarcity-chip ${cls}`;
        chip.textContent = `${pos} T${tierNum}: ${remaining} left`;
        bar.appendChild(chip);
      }
    });
  });
  if (!bar.innerHTML) bar.innerHTML = '<div class="scarcity-chip">No scarcity alerts yet</div>';
}

// ---------- Roster ----------

const ROSTER_SLOTS = ['QB','RB','RB','WR','WR','TE','FLEX','FLEX','BENCH','BENCH','BENCH','BENCH','BENCH','BENCH'];

function getMyRoster() {
  return getAllPlayersFlat().filter(p => drafted[p.key] === 'me');
}

function renderRoster() {
  const myTeam = getMyRoster();
  document.getElementById('rosterCount').textContent = `(${myTeam.length} drafted)`;
  const grid = document.getElementById('rosterGrid');
  grid.innerHTML = '';

  if (myTeam.length === 0) {
    grid.innerHTML = '<div class="roster-empty">No players drafted yet. Mark players "Me" as you draft them.</div>';
    return;
  }

  const counts = {RB:0, WR:0, TE:0, QB:0};
  myTeam.forEach(p => counts[p.pos] = (counts[p.pos]||0) + 1);

  Object.entries(counts).forEach(([pos, count]) => {
    const slot = document.createElement('div');
    slot.className = 'roster-slot filled';
    slot.textContent = `${pos}: ${count}`;
    grid.appendChild(slot);
  });

  // Flag needs
  const needs = [];
  if (counts.RB < 2) needs.push('RB');
  if (counts.WR < 2) needs.push('WR');
  if (counts.TE < 1) needs.push('TE');
  if (counts.QB < 1) needs.push('QB');
  if (needs.length) {
    const needSlot = document.createElement('div');
    needSlot.className = 'roster-slot roster-need';
    needSlot.textContent = `Need: ${needs.join(', ')}`;
    grid.appendChild(needSlot);
  }
}

// ---------- Best Available Suggestion ----------

function renderSuggestions() {
  const myTeam = getMyRoster();
  const counts = {RB:0, WR:0, TE:0, QB:0};
  myTeam.forEach(p => counts[p.pos] = (counts[p.pos]||0) + 1);

  const allAvailable = getAllPlayersFlat().filter(p => drafted[p.key] === undefined);

  // Score: lower tier number = better, lower effective rank = better, positional need boosts score
  const scored = allAvailable.map(p => {
    let needBoost = 0;
    let surplusPenalty = 0;

    if (p.pos === 'RB' && counts.RB < 2) needBoost = 3;
    else if (p.pos === 'WR' && counts.WR < 2) needBoost = 2;
    else if (p.pos === 'TE' && counts.TE < 1) needBoost = 1.5;
    else if (p.pos === 'QB' && counts.QB < 1) needBoost = 1;

    // Once starter slot is filled, deprioritize unless it's elite value (Tier 1)
    if (p.pos === 'QB' && counts.QB >= 1) surplusPenalty = p.tier > 1 ? 25 : 4;
    if (p.pos === 'TE' && counts.TE >= 1) surplusPenalty = p.tier > 1 ? 25 : 4;

    const score = (p.tier * 10) + (p.r * 0.1) - needBoost - (p.box ? 2 : 0) + surplusPenalty;
    return {...p, score};
  });

  scored.sort((a, b) => a.score - b.score);
  const top3 = scored.slice(0, 3);

  const list = document.getElementById('suggestionList');
  list.innerHTML = '';
  if (top3.length === 0) {
    list.innerHTML = '<div class="no-suggestion">No players available — check filters or drafted list.</div>';
    return;
  }

  top3.forEach((p, i) => {
    let reason = `Tier ${p.tier}`;
    if (p.box) reason += ' · target';
    if (p.pos === 'RB' && counts.RB < 2) reason += ' · fills RB need';
    if (p.pos === 'WR' && counts.WR < 2) reason += ' · fills WR need';
    if (p.pos === 'TE' && counts.TE < 1) reason += ' · fills TE need';

    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.innerHTML = `
      <span class="suggestion-rank">${i+1}</span>
      <span class="suggestion-pos-tag ${p.pos}">${p.pos}</span>
      <span class="suggestion-name">${p.n}</span>
      <span class="suggestion-reason">${reason}</span>
    `;
    list.appendChild(item);
  });
}

// ---------- Main render ----------

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const tierF  = document.getElementById('tierFilter').value;
  const flagF  = document.getElementById('flagFilter').value;
  const tbody  = document.getElementById('tbody');
  tbody.innerHTML = '';
  const players = getPlayers(curPos);
  let lastTier = null, idx = 0;

  players.forEach(p => {
    const key       = curPos + p.r;
    const draftState = drafted[key]; // undefined | 'me' | 'other'
    const isDrafted = draftState !== undefined;
    const note      = notes[key] || '';
    const adj       = rankOverrides[key] || 0;

    if (search && !p.n.toLowerCase().includes(search) && !p.t.toLowerCase().includes(search)) return;
    if (tierF && String(p.tier) !== tierF) return;
    if (flagF === 'box'   && !p.box)    return;
    if (flagF === 'inj'   && !p.inj)    return;
    if (flagF === 'avail' && isDrafted) return;

    if (p.tier !== lastTier && p.tier > (lastTier || 0)) {
      const d = document.createElement('tr');
      d.className = 'tier-divider';
      d.innerHTML = `<td colspan="6">— Tier ${p.tier}</td>`;
      tbody.appendChild(d);
      lastTier = p.tier;
    }
    idx++;

    const tags = [];
    if (p.box)     tags.push('<span class="tag target">target</span>');
    if (p.inj)     tags.push('<span class="tag flagged">flagged</span>');
    if (adj < 0)   tags.push(`<span class="tag up">▲${Math.abs(adj)}</span>`);
    if (adj > 0)   tags.push(`<span class="tag down">▼${adj}</span>`);
    if (draftState === 'me')    tags.push('<span class="tag mine">mine</span>');
    if (draftState === 'other') tags.push('<span class="tag gone">drafted</span>');

    const tr = document.createElement('tr');
    tr.className = 'player-row' + (draftState === 'other' ? ' drafted' : '') + (draftState === 'me' ? ' drafted-me' : '');
    tr.innerHTML = `
      <td class="rank">${idx}</td>
      <td><div class="name-cell">
        <span class="dot" style="background:${TIER_COLORS[lastTier]}"></span>
        ${p.n}${tags.join('')}
      </div></td>
      <td class="team">${p.t}</td>
      <td class="tier-num">${lastTier}</td>
      <td><input class="notes-input" type="text" value="${(note || '').replace(/"/g, '&quot;')}" placeholder="—" onchange="saveNote('${key}', this.value)"></td>
      <td><div class="draft-actions">
        <button class="me ${draftState === 'me' ? 'active-me' : ''}" onclick="setDraftState('${key}','me')">Me</button>
        <button class="other ${draftState === 'other' ? 'active-other' : ''}" onclick="setDraftState('${key}','other')">Other</button>
      </div></td>
    `;
    tbody.appendChild(tr);
  });

  renderScarcity();
  renderSuggestions();
  renderRoster();
  renderPickTracker();
}

function saveNote(key, val) { notes[key] = val; save('notes', notes); }

function setDraftState(key, who) {
  if (drafted[key] === who) {
    delete drafted[key]; // toggle off
  } else {
    drafted[key] = who;
  }
  save('drafted', drafted);
  render();
}

function clearDrafted() { drafted = {}; save('drafted', drafted); render(); }

async function addUpdate() {
  const input = document.getElementById('updateInput');
  const text  = input.value.trim();
  if (!text) return;

  const ts = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const id = Date.now();
  updates.unshift({id, text, ts, analysis: null, loading: true, sentimentOverride: null, snapshot: JSON.parse(JSON.stringify(rankOverrides))});
  input.value = '';
  renderFeed();

  const playerList = Object.entries(DATA).flatMap(([pos, players]) =>
    players.map(p => `${p.n} (${pos}, ${p.t}, Rank ${p.r}, Tier ${p.tier})`)
  ).join('\n');

  const prompt = `You are a fantasy football analyst assistant helping with a 2026 PPR fantasy draft. A user has this draft board:

${playerList}

The user has added this news update: "${text}"

IMPORTANT CONTEXT FOR SENTIMENT:
- Phrases like "stocks rising", "stock up", "arrow up", "rising stock", upward arrow emojis (📈 ↑ ⬆), or positive analyst reactions mean POSITIVE sentiment
- Phrases like "stocks falling", "stock down", "arrow down", downward arrow emojis (📉 ↓ ⬇), injury news, suspension news mean NEGATIVE sentiment
- Getting more reps, first team reps, snap share increases, target share increases are POSITIVE
- Losing reps, role changes that reduce opportunity, injury concerns are NEGATIVE
- Read the full context carefully — a player "lining up with" another star player at the same time can mean POSITIVE opportunity sharing, not negative

Respond with JSON ONLY (no markdown, no backticks, no extra text):
{
  "sentiment": "positive"|"negative"|"neutral",
  "summary": "1-2 sentence plain English fantasy impact",
  "adjustments": [
    {
      "player": "exact name from list above",
      "position": "RB|WR|TE|QB",
      "rankChange": number (negative=move up, positive=move down, 0=unchanged),
      "tierChange": number (negative=better tier, positive=worse tier, 0=unchanged),
      "flagged": true|false,
      "reason": "brief reason"
    }
  ]
}
Only include players actually affected. rankChange should be 1-5 spots max. Return empty adjustments array if no players identifiable.`;

  try {
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{role: 'user', content: prompt}]
      })
    });
    const data   = await res.json();
    const raw    = data.content?.find(c => c.type === 'text')?.text || '{}';
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());

    parsed.adjustments?.forEach(adj => {
      const pos    = adj.position;
      const player = DATA[pos]?.find(p => p.n === adj.player);
      if (!player) return;
      const key = pos + player.r;
      if (adj.rankChange !== 0) rankOverrides[key] = (rankOverrides[key] || 0) + adj.rankChange;
      if (adj.tierChange !== 0) {
        const base = tierOverrides[key] !== undefined ? tierOverrides[key] : player.tier;
        tierOverrides[key] = Math.max(1, Math.min(6, base + adj.tierChange));
      }
      if (adj.flagged) injOverrides[key] = true;
    });

    const entry = updates.find(u => u.id === id);
    if (entry) { entry.analysis = parsed; entry.loading = false; }

  } catch(e) {
    const entry = updates.find(u => u.id === id);
    if (entry) { entry.analysis = {sentiment: 'neutral', summary: 'Error: ' + e.message, adjustments: []}; entry.loading = false; }
  }

  renderFeed();
  render();
  save('updates', updates);
  save('rankOverrides', rankOverrides);
  save('tierOverrides', tierOverrides);
  save('injOverrides', injOverrides);
}

function overrideSentiment(id, sentiment) {
  const entry = updates.find(u => u.id === id);
  if (!entry || !entry.analysis) return;

  rankOverrides = JSON.parse(JSON.stringify(entry.snapshot));

  if (entry.sentimentOverride !== sentiment) {
    entry.sentimentOverride = sentiment;
    const flip = sentiment === 'positive' ? -1 : 1;
    (entry.analysis.adjustments || []).forEach(adj => {
      const player = DATA[adj.position]?.find(p => p.n === adj.player);
      if (!player) return;
      const key = adj.position + player.r;
      if (adj.rankChange !== 0) rankOverrides[key] = (rankOverrides[key] || 0) + (Math.abs(adj.rankChange) * flip);
    });
  } else {
    entry.sentimentOverride = null;
  }

  save('updates', updates);
  save('rankOverrides', rankOverrides);
  renderFeed();
  render();
}

function removeUpdate(id) {
  const entry = updates.find(u => u.id === id);
  if (entry && entry.snapshot) {
    rankOverrides = JSON.parse(JSON.stringify(entry.snapshot));
    save('rankOverrides', rankOverrides);
  }
  updates = updates.filter(u => u.id !== id);
  save('updates', updates);
  renderFeed();
  render();
}

function renderFeed() {
  const feed = document.getElementById('feed');
  if (!updates.length) { feed.innerHTML = '<div class="no-feed">No updates yet.</div>'; return; }
  feed.innerHTML = '';
  updates.forEach(u => {
    const effectiveSentiment = u.sentimentOverride || u.analysis?.sentiment || 'neutral';
    const el = document.createElement('div');
    el.className = `feed-item ${effectiveSentiment}`;

    let analysisHtml = '';
    if (u.loading) {
      analysisHtml = '<div class="analysing">Analysing…</div>';
    } else if (u.analysis) {
      const a = u.analysis;
      let movesHtml = '';
      (a.adjustments || []).forEach(adj => {
        const dir   = adj.rankChange < 0 ? 'up' : adj.rankChange > 0 ? 'down' : 'watch';
        const label = adj.rankChange < 0 ? `▲${Math.abs(adj.rankChange)} spots` : adj.rankChange > 0 ? `▼${adj.rankChange} spots` : 'watch';
        movesHtml += `<span class="move-tag ${dir}">${adj.player}: ${label}</span>`;
      });
      analysisHtml = `<div class="feed-analysis">${a.summary}${movesHtml ? '<br><br>' + movesHtml : ''}</div>`;
    }

    const posActive = u.sentimentOverride === 'positive' ? 'active-pos' : '';
    const negActive = u.sentimentOverride === 'negative' ? 'active-neg' : '';

    el.innerHTML = `
      <div class="feed-top">
        <span class="feed-ts">${u.ts}</span>
        <span class="feed-text">${u.text}</span>
        <div class="feed-actions">
          <button class="feed-override ${posActive}" onclick="overrideSentiment(${u.id}, 'positive')" title="Mark positive">↑</button>
          <button class="feed-override ${negActive}" onclick="overrideSentiment(${u.id}, 'negative')" title="Mark negative">↓</button>
          <span class="feed-del" onclick="removeUpdate(${u.id})">✕</span>
        </div>
      </div>${analysisHtml}`;
    feed.appendChild(el);
  });
}

render();
renderFeed();
</script>
</body>
</html>
